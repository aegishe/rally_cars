<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拉力赛成绩热力图 - 赛段数据可视化</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface2: #1c2333;
            --border: #30363d;
            --text: #e6edf3;
            --text-dim: #8b949e;
            --green: #2ea043;
            --green-dark: #1a7f37;
            --yellow: #d4a72c;
            --orange: #d4732c;
            --red: #cf222e;
            --red-dark: #8b1a1a;
            --gray: #3d444d;
            --gray-dark: #2d333b;
            --accent: #58a6ff;
            --gold: #e3b341;
            --purple: #bc8cff;
            --header-bg: #1a1f2e;
            --row-hover: #212a3b;
            --tooltip-bg: #1c2333;
            --tooltip-border: #58a6ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', -apple-system, sans-serif;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1600px;
            width: 100%;
            background: var(--surface);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border);
        }
        .header h1 {
            font-size: 1.8em;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header .subtitle {
            color: var(--text-dim);
            font-size: 0.95em;
            margin-top: 6px;
            letter-spacing: 1px;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            justify-content: center;
            align-items: center;
            margin: 16px 0 20px;
            padding: 14px 20px;
            background: var(--surface2);
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 0.85em;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-dim);
        }
        .legend-swatch {
            width: 20px;
            height: 16px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: inline-block;
        }
        .legend-swatch.sw-green {
            background: #1a7f37;
        }
        .legend-swatch.sw-yellow-green {
            background: #6b9e3a;
        }
        .legend-swatch.sw-yellow {
            background: #d4a72c;
        }
        .legend-swatch.sw-orange {
            background: #d4732c;
        }
        .legend-swatch.sw-red {
            background: #cf222e;
        }
        .legend-swatch.sw-darkred {
            background: #6b1010;
        }
        .legend-swatch.sw-gray {
            background: #3d444d;
        }
        .legend-swatch.sw-darkgray {
            background: #1f242b;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 16px;
            align-items: center;
        }
        .controls button {
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.25s;
            font-family: inherit;
        }
        .controls button:hover {
            background: var(--row-hover);
            border-color: var(--accent);
            color: var(--accent);
        }
        .controls button.active {
            background: var(--accent);
            color: #0d1117;
            border-color: var(--accent);
            font-weight: 600;
        }
        .controls .search-input {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85em;
            width: 200px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.25s;
        }
        .controls .search-input:focus {
            border-color: var(--accent);
        }
        .controls .search-input::placeholder {
            color: var(--text-dim);
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid var(--border);
            max-height: 75vh;
            overflow-y: auto;
            position: relative;
        }
        .table-wrapper::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .table-wrapper::-webkit-scrollbar-track {
            background: var(--surface);
        }
        .table-wrapper::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: var(--text-dim);
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 1400px;
            font-size: 0.82em;
            white-space: nowrap;
        }
        table thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }
        table th {
            background: var(--header-bg);
            color: var(--text);
            padding: 10px 12px;
            text-align: center;
            font-weight: 600;
            font-size: 0.88em;
            border-bottom: 2px solid var(--border);
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
        }
        table th.row-label {
            position: sticky;
            left: 0;
            z-index: 11;
            background: var(--header-bg);
            text-align: left;
            min-width: 160px;
        }
        table th.row-label-corner {
            position: sticky;
            top: 0;
            left: 0;
            z-index: 12;
            background: var(--header-bg);
            min-width: 160px;
        }
        table td {
            padding: 7px 10px;
            text-align: center;
            border-bottom: 1px solid rgba(48, 54, 61, 0.6);
            transition: all 0.15s;
            position: relative;
            font-variant-numeric: tabular-nums;
        }
        table td.row-label {
            position: sticky;
            left: 0;
            z-index: 5;
            background: var(--surface);
            text-align: left;
            font-weight: 500;
            border-right: 1px solid var(--border);
            min-width: 160px;
            white-space: normal;
            line-height: 1.3;
            font-size: 0.82em;
        }
        table tbody tr {
            transition: background 0.15s;
        }
        table tbody tr:hover td {
            background: var(--row-hover);
        }
        table tbody tr:hover td.row-label {
            background: var(--row-hover);
            border-right-color: var(--accent);
        }
        table tbody tr.selected td {
            background: rgba(88, 166, 255, 0.12);
        }
        table tbody tr.selected td.row-label {
            background: rgba(88, 166, 255, 0.2);
            border-right-color: var(--accent);
            font-weight: 700;
        }

        .cell-time {
            display: block;
            font-size: 0.9em;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .cell-status {
            display: block;
            font-size: 0.7em;
            color: var(--text-dim);
            margin-top: 2px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        .cell-dnf {
            color: #6e7681;
            font-weight: 700;
            font-size: 1.1em;
        }
        .badge {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 0.72em;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-left: 4px;
            vertical-align: middle;
        }
        .badge-dnf {
            background: #3d444d;
            color: #e6edf3;
        }
        .badge-penalty {
            background: #cf222e;
            color: #fff;
        }
        .badge-slow {
            background: #d4732c;
            color: #fff;
        }
        .badge-fastest {
            background: #2ea043;
            color: #fff;
        }
        .badge-total-fastest {
            background: #e3b341;
            color: #0d1117;
            font-size: 0.78em;
            padding: 2px 8px;
        }

        .total-col {
            font-weight: 700;
            font-size: 0.88em;
            background: rgba(227, 179, 65, 0.08) !important;
        }
        td.total-col {
            font-weight: 700;
        }
        .rank-col {
            font-weight: 700;
            font-size: 1em;
            color: var(--gold);
            background: rgba(227, 179, 65, 0.06) !important;
            min-width: 50px;
        }

        .tooltip {
            position: fixed;
            pointer-events: none;
            background: var(--tooltip-bg);
            border: 1px solid var(--tooltip-border);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.82em;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            max-width: 300px;
            line-height: 1.5;
            color: var(--text);
            display: none;
        }
        .tooltip .tt-title {
            font-weight: 700;
            font-size: 0.92em;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .tooltip .tt-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .tooltip .tt-label {
            color: var(--text-dim);
        }
        .tooltip .tt-value {
            font-weight: 600;
        }

        .footer-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            margin-top: 16px;
            padding: 12px 16px;
            background: var(--surface2);
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.82em;
            color: var(--text-dim);
        }
        .footer-stats span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .footer-stats .stat-val {
            color: var(--text);
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .container {
                padding: 12px;
                border-radius: 10px;
            }
            .header h1 {
                font-size: 1.3em;
            }
            .legend {
                gap: 10px;
                font-size: 0.75em;
                padding: 10px 14px;
            }
            table {
                font-size: 0.75em;
                min-width: 1000px;
            }
            table th,
            table td {
                padding: 5px 7px;
            }
            .controls .search-input {
                width: 140px;
            }
        }
    </style>
</head>

    <div class="container">
        <div class="header">
            <h1>🏁 拉力赛赛段成绩热力图</h1>
            <div class="subtitle">Rally Stage Results Visualization — T2.E / T2.1 组别</div>
        </div>

        <div class="legend" id="legend">

            <span class="legend-item"><span class="legend-swatch sw-yellow"></span> 中等</span>
            <span class="legend-item"><span class="legend-swatch sw-orange"></span> 偏慢</span>
            <span class="legend-item"><span class="legend-swatch sw-red"></span> 罚时 (&ge;15h)</span>
            <span class="legend-item"><span class="legend-swatch sw-darkred"></span> 严重罚时 (&ge;40h)</span>
            <span class="legend-item"><span class="legend-swatch sw-gray"></span> 退赛 / 无成绩</span>
            <span class="legend-item">🏆 <span style="color:#e3b341;font-weight:700;">总成绩最快</span></span>
        </div>

        <div class="controls">
            <button id="btn-all" class="active" onclick="setFilter('all')">全部车手</button>
            <button id="btn-finished" onclick="setFilter('finished')">仅完赛车手</button>
            <button id="btn-dnf" onclick="setFilter('dnf')">仅退赛车手</button>
            <input type="text" id="search-input" class="search-input" placeholder="🔍 搜索车手或车队..." oninput="applySearch()">
            <button onclick="resetSelection()" title="清除高亮">✕ 清除高亮</button>
        </div>

        <div class="table-wrapper" id="table-wrapper">
            <table id="results-table">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>

        <div class="footer-stats" id="footer-stats">
            <!-- 动态填充 -->
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

        const SS_LABELS = ['SS1', 'SS2', 'SS3', 'SS4', 'SS5', 'SS6', 'SS7', 'SS8', 'SS9', 'SS10', 'SS11', 'SS12'];

        const SEVERE_PENALTY_THRESHOLD = 40 * 3600; // >=40小时严重罚时

        function parseTimeToSeconds(timeStr) {
            if (!timeStr || timeStr === '-' || timeStr === '') return null;
            const parts = timeStr.split(':').map(Number);
            if (parts.length === 3) {
                let [h, m, s] = parts;
                if (m >= 60) {
                    h += Math.floor(m / 60);
                    m = m % 60;
                }
                if (s >= 60) {
                    m += Math.floor(s / 60);
                    s = s % 60;
                }
                if (m >= 60) {
                    h += Math.floor(m / 60);
                    m = m % 60;
                }
                return h * 3600 + m * 60 + s;
            } else if (parts.length === 2) {
                return parts[0] * 60 + parts[1];
            }
            return null;
        }

        function formatSeconds(sec) {
            if (sec === null || sec === undefined) return '-';
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = Math.floor(sec % 60);
            if (h > 0) {
                return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            } else {
                return `${m}:${String(s).padStart(2, '0')}`;
            }
        }

        function formatSecondsFull(sec) {
            if (sec === null || sec === undefined) return '—';
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = Math.floor(sec % 60);
            return `${h}小时${m}分${s}秒`;
        }

        function isPenalty(sec) {
            return sec !== null && sec >= PENALTY_THRESHOLD;
        }

        function isSeverePenalty(sec) {
            return sec !== null && sec >= SEVERE_PENALTY_THRESHOLD;
        }

        function isSlow(sec) {
            return sec !== null && sec >= SLOW_THRESHOLD && sec < PENALTY_THRESHOLD;
        }

        function isDNF(timeStr) {
            return timeStr === '-' || timeStr === '' || timeStr === null;
        }

        // 处理数据
        const processedData = rawData.map(d => {
            const parsedTimes = d.times.map(t => parseTimeToSeconds(t));
            const dnfs = d.times.map(t => isDNF(t));
            const totalSec = parsedTimes.reduce((sum, t, i) => {
                if (!dnfs[i] && t !== null) return sum + t;
                return sum;
            }, 0);
            const completedStages = dnfs.filter(d => !d).length;
            const hasDNF = dnfs.some(d => d === true);
            const totalPenalties = parsedTimes.filter(t => isPenalty(t)).length;
            return {
                ...d,
                parsedTimes,
                dnfs,
                totalSec,
                completedStages,
                hasDNF,
                totalPenalties,
            };
        });

        // 计算每个赛段的最快时间（仅考虑正常时间，非罚时非退赛）
        const stageFastest = [];
        for (let s = 0; s < 12; s++) {
            let fastest = null;
            for (const d of processedData) {
                const t = d.parsedTimes[s];
                if (t !== null && !isPenalty(t) && !d.dnfs[s]) {
                    if (fastest === null || t < fastest) {
                        fastest = t;
                    }
                }
            }
            stageFastest.push(fastest);
        }

        // 计算每辆车是否是某个赛段最快
        processedData.forEach(d => {
            d.isStageFastest = [];
            for (let s = 0; s < 12; s++) {
                d.isStageFastest.push(d.parsedTimes[s] !== null && stageFastest[s] !== null && d.parsedTimes[s] ===
                    stageFastest[s] && !isPenalty(d.parsedTimes[s]) && !d.dnfs[s]);
            }
            // 总成绩最快（仅完赛车手）
            d.isTotalFastest = false;
        });

        const finishedDrivers = processedData.filter(d => !d.hasDNF);
        if (finishedDrivers.length > 0) {
            const minTotal = Math.min(...finishedDrivers.map(d => d.totalSec));
            finishedDrivers.forEach(d => {
                if (d.totalSec === minTotal) {
                    d.isTotalFastest = true;
                }
            });
        }

        // 排序：完赛的按总时间升序，退赛的按总时间降序在后
        processedData.sort((a, b) => {
            if (a.hasDNF && !b.hasDNF) return 1;
            if (!a.hasDNF && b.hasDNF) return -1;
            if (a.hasDNF && b.hasDNF) {
                return a.completedStages === b.completedStages ?
                    a.totalSec - b.totalSec :
                    b.completedStages - a.completedStages;
            }
            return a.totalSec - b.totalSec;
        });

        // 分配排名
        processedData.forEach((d, idx) => {
            d.rank = idx + 1;
        });

        // 渲染
        let currentFilter = 'all';
        let searchQuery = '';
        let selectedRow = null;

        function getFilteredData() {
            let filtered = processedData;
            if (currentFilter === 'finished') {
                filtered = filtered.filter(d => !d.hasDNF);
            } else if (currentFilter === 'dnf') {
                filtered = filtered.filter(d => d.hasDNF);
            }
            if (searchQuery.trim()) {
                const q = searchQuery.trim().toLowerCase();
                filtered = filtered.filter(d =>
                    d.driver.toLowerCase().includes(q) ||
                    d.team.toLowerCase().includes(q) ||
                    d.model.toLowerCase().includes(q) ||
                    String(d.no).includes(q)
                );
            }
            return filtered;
        }

        function getColorForStage(sec, isDnf, isFastest) {
            if (isDnf) return 'background:#1f242b;color:#6e7681;';
            if (sec === null) return 'background:#1f242b;color:#6e7681;';
            if (isSeverePenalty(sec)) return 'background:#6b1010;color:#ff8a8a;';
            if (isPenalty(sec)) return 'background:#cf222e;color:#fff;';
            if (isSlow(sec)) return 'background:#d4732c;color:#fff;';

            // 正常时间 - 基于赛段内相对位置
            const stageIdx = processedData.findIndex(d => d.parsedTimes.some((t, i) => t === sec && i === stageIdx));
            // 需要更精确的赛段定位 - 通过调用者传入stage索引
            return null; // 将在下面具体计算
        }

        function getCellStyle(d, stageIdx) {
            const sec = d.parsedTimes[stageIdx];
            const isDnfCell = d.dnfs[stageIdx];
            const isFastest = d.isStageFastest[stageIdx];

            if (isDnfCell) {
                return { bg: '#1f242b', color: '#6e7681', label: 'DNF', cls: 'cell-dnf' };
            }
            if (sec === null) {
                return { bg: '#1f242b', color: '#6e7681', label: '—', cls: 'cell-dnf' };
            }
            if (isSeverePenalty(sec)) {
                return { bg: '#6b1010', color: '#ff8a8a', label: '严重罚时', cls: '' };
            }
            if (isPenalty(sec)) {
                return { bg: '#cf222e', color: '#ffffff', label: '罚时', cls: '' };
            }
            if (isSlow(sec)) {
                return { bg: '#d4732c', color: '#ffffff', label: '偏慢', cls: '' };
            }

            // 正常时间 - 计算相对于该赛段最快时间的比例
            const fastest = stageFastest[stageIdx];
            if (fastest && fastest > 0) {
                const ratio = sec / fastest; // 1.0 = fastest
                // ratio范围大约1.0到3.0
                if (ratio <= 1.05) return { bg: '#1a7f37', color: '#fff', label: '最快', cls: '' };
                if (ratio <= 1.2) return { bg: '#2d8c3c', color: '#fff', label: '快', cls: '' };
                if (ratio <= 1.4) return { bg: '#4a9e3a', color: '#fff', label: '较快', cls: '' };
                if (ratio <= 1.6) return { bg: '#6b9e3a', color: '#fff', label: '中等', cls: '' };
                if (ratio <= 1.8) return { bg: '#9e9e3a', color: '#0d1117', label: '中慢', cls: '' };
                if (ratio <= 2.0) return { bg: '#d4a72c', color: '#0d1117', label: '偏慢', cls: '' };
                if (ratio <= 2.3) return { bg: '#d48a2c', color: '#0d1117', label: '慢', cls: '' };
                return { bg: '#d4732c', color: '#fff', label: '很慢', cls: '' };
            }
            return { bg: '#2ea043', color: '#fff', label: '', cls: '' };
        }

        function buildTable() {
            const filtered = getFilteredData();
            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');

            // 构建表头
            let headHTML = `
                <tr>
                    <th class="row-label-corner">排名 / 车手</th>
                    <th class="row-label">车队 / 车型</th>
                    ${SS_LABELS.map(ss => `<th>${ss}</th>`).join('')}
                    <th>总成绩</th>
                </tr>`;
            thead.innerHTML = headHTML;

            // 构建表体
            let bodyHTML = '';
            for (const d of filtered) {
                const isSelected = selectedRow === d.no;
                const rowClass = isSelected ? 'selected' : '';
                const totalDisplay = d.hasDNF ?
                    `⚠ ${formatSeconds(d.totalSec)}` :
                    formatSeconds(d.totalSec);
                const rankDisplay = d.isTotalFastest ?
                    `🏆 ${d.rank}` :
                    (d.hasDNF ? `DNF` : `${d.rank}`);

                bodyHTML += `<tr class="${rowClass}" data-no="${d.no}" onclick="selectRow(${d.no})">`;
                bodyHTML +=
                    `<td class="row-label rank-col" style="font-weight:700;">${rankDisplay}<br><span style="font-size:0.75em;color:var(--text-dim);">#${d.no} ${d.driver}</span></td>`;
                bodyHTML +=
                    `<td class="row-label" style="font-size:0.75em;"><strong>${d.team}</strong><br><span style="color:var(--text-dim);">${d.model} · ${d.group}</span></td>`;

                for (let s = 0; s < 12; s++) {
                    const timeStr = d.times[s];
                    const style = getCellStyle(d, s);
                    const sec = d.parsedTimes[s];
                    const isDnfCell = d.dnfs[s];

                    if (isDnfCell) {
                        bodyHTML += `<td style="background:#1f242b;color:#6e7681;font-weight:700;" 
                            data-no="${d.no}" data-stage="${s}" 
                            data-time="-" data-sec="null" data-dnf="true"
                            onmouseenter="showTooltip(event,${d.no},${s})" onmouseleave="hideTooltip()">
                            <span class="cell-dnf">DNF</span>
                            <span class="cell-status">退赛</span>
                        </td>`;
                    } else {
                        const badge = d.isStageFastest[s] ? ' 🏆' : '';
                        bodyHTML += `<td style="background:${style.bg};color:${style.color};cursor:pointer;" 
                            data-no="${d.no}" data-stage="${s}" 
                            data-time="${timeStr}" data-sec="${sec}" data-dnf="false"
                            data-label="${style.label}"
                            onmouseenter="showTooltip(event,${d.no},${s})" onmouseleave="hideTooltip()"
                            onclick="cellClick(${d.no},${s})">
                            <span class="cell-time">${timeStr}${badge}</span>
                            ${style.label ? `<span class="cell-status" style="opacity:0.8;">${style.label}</span>` : ''}
                        </td>`;
                    }
                }

                // 总成绩列
                const totalStyle = d.isTotalFastest ?
                    'background:rgba(227,179,65,0.2);color:#e3b341;font-weight:700;' :
                    (d.hasDNF ? 'background:rgba(207,34,46,0.1);color:#ff8a8a;' :
                        'background:rgba(88,166,255,0.08);color:#e6edf3;');
                bodyHTML += `<td class="total-col" style="${totalStyle}">
                    ${totalDisplay}
                    ${d.isTotalFastest ? '<span class="badge badge-total-fastest">最快</span>' : ''}
                    ${d.hasDNF ? '<span class="badge badge-dnf">退赛</span>' : ''}
                </td>`;

                bodyHTML += '</tr>';
            }

            if (filtered.length === 0) {
                bodyHTML =
                    `<tr><td colspan="15" style="text-align:center;padding:40px;color:var(--text-dim);font-size:1em;">没有匹配的车手</td></tr>`;
            }

            tbody.innerHTML = bodyHTML;
            updateFooterStats(filtered);
        }

        function updateFooterStats(filtered) {
            const footer = document.getElementById('footer-stats');
            const finished = filtered.filter(d => !d.hasDNF);
            const dnf = filtered.filter(d => d.hasDNF);
            const totalPenalties = filtered.reduce((sum, d) => sum + d.totalPenalties, 0);
            const fastestDriver = finished.length > 0 ? finished.reduce((min, d) => d.totalSec < min.totalSec ? d : min) :
                null;

            let html = `<span>📋 显示 <span class="stat-val">${filtered.length}</span> 辆车</span>`;
            html += `<span>✅ 完赛 <span class="stat-val">${finished.length}</span></span>`;
            html += `<span>❌ 退赛 <span class="stat-val">${dnf.length}</span></span>`;
            html += `<span>⚠️ 总罚时次数 <span class="stat-val">${totalPenalties}</span></span>`;
            if (fastestDriver) {
                html +=
                    `<span>🏆 最快总成绩 <span class="stat-val" style="color:#e3b341;">#${fastestDriver.no} ${fastestDriver.driver} — ${formatSeconds(fastestDriver.totalSec)}</span></span>`;
            }
            html += `<span>📅 赛段数 <span class="stat-val">12</span></span>`;
            footer.innerHTML = html;
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
            if (filter === 'all') document.getElementById('btn-all').classList.add('active');
            if (filter === 'finished') document.getElementById('btn-finished').classList.add('active');
            if (filter === 'dnf') document.getElementById('btn-dnf').classList.add('active');
            buildTable();
        }

        function applySearch() {
            searchQuery = document.getElementById('search-input').value;
            buildTable();
        }

        function selectRow(no) {
            if (selectedRow === no) {
                selectedRow = null;
            } else {
                selectedRow = no;
            }
            buildTable();
            // 滚动到选中的行
            setTimeout(() => {
                const row = document.querySelector(`tr[data-no="${selectedRow}"]`);
                if (row) row.scrollIntoView({ block: 'center', behavior: 'smooth' });
            }, 50);
        }

        function resetSelection() {
            selectedRow = null;
            buildTable();
        }

        function cellClick(no, stage) {
            selectRow(no);
        }

        function showTooltip(event, no, stage) {
            const d = processedData.find(d => d.no === no);
            if (!d) return;
            const timeStr = d.times[stage];
            const sec = d.parsedTimes[stage];
            const isDnfCell = d.dnfs[stage];
            const tooltip = document.getElementById('tooltip');
            const style = getCellStyle(d, stage);

            let html = `<div class="tt-title">#${d.no} ${d.driver} — ${SS_LABELS[stage]}</div>`;
            html += `<div class="tt-row"><span class="tt-label">车队</span><span class="tt-value">${d.team}</span></div>`;
            html += `<div class="tt-row"><span class="tt-label">车型</span><span class="tt-value">${d.model}</span></div>`;
            html += `<div class="tt-row"><span class="tt-label">组别</span><span class="tt-value">${d.group}</span></div>`;

            if (isDnfCell) {
                html +=
                    `<div class="tt-row" style="color:#cf222e;"><span class="tt-label">状态</span><span class="tt-value">退赛 / 无成绩</span></div>`;
            } else {
                html +=
                    `<div class="tt-row"><span class="tt-label">成绩</span><span class="tt-value">${timeStr} (${formatSecondsFull(sec)})</span></div>`;
                if (isSeverePenalty(sec)) {
                    html +=
                        `<div class="tt-row" style="color:#ff8a8a;"><span class="tt-label">状态</span><span class="tt-value">严重罚时</span></div>`;
                } else if (isPenalty(sec)) {
                    html +=
                        `<div class="tt-row" style="color:#ff6b6b;"><span class="tt-label">状态</span><span class="tt-value">罚时</span></div>`;
                } else if (isSlow(sec)) {
                    html +=
                        `<div class="tt-row" style="color:#ffa94d;"><span class="tt-label">状态</span><span class="tt-value">偏慢</span></div>`;
                } else {
                    const fastest = stageFastest[stage];
                    if (fastest) {
                        const diff = sec - fastest;
                        html +=
                            `<div class="tt-row"><span class="tt-label">差距</span><span class="tt-value">+${formatSeconds(diff)}</span></div>`;
                    }
                    if (d.isStageFastest[stage]) {
                        html +=
                            `<div class="tt-row" style="color:#2ea043;"><span class="tt-label">🏆</span><span class="tt-value">赛段最快</span></div>`;
                    }
                }
                if (d.totalPenalties > 0) {
                    html +=
                        `<div class="tt-row" style="color:#cf222e;"><span class="tt-label">总罚时次数</span><span class="tt-value">${d.totalPenalties}</span></div>`;
                }
            }

            tooltip.innerHTML = html;
            tooltip.style.display = 'block';

            const tooltipWidth = 280;
            const tooltipHeight = 180;
            let left = event.clientX + 16;
            let top = event.clientY - 10;
            if (left + tooltipWidth > window.innerWidth) {
                left = event.clientX - tooltipWidth - 16;
            }
            if (top + tooltipHeight > window.innerHeight) {
                top = window.innerHeight - tooltipHeight - 10;
            }
            if (top < 10) top = 10;
            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
        }

        function hideTooltip() {
            document.getElementById('tooltip').style.display = 'none';
        }

        // 初始渲染
        buildTable();

        // 键盘导航
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                resetSelection();
                hideTooltip();
            }
        });

        // 窗口大小变化时隐藏tooltip
        window.addEventListener('resize', hideTooltip);

        // 点击表格外部清除高亮
        document.addEventListener('click', (e) => {
            if (!e.target.closest('table') && !e.target.closest('.controls')) {
                selectedRow = null;
                buildTable();
            }
        });
    </script>

</body>
</html>
